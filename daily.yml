name: Daily Iran Think-Tank Digest

on:
  schedule:
    # هر روز ساعت 06:00 UTC (حدود 09:30 به‌وقت ایران) اجرا می‌شود.
    # می‌توانید عدد ساعت را تغییر دهید. فرمت cron: "دقیقه ساعت * * *"
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # امکان اجرای دستی از تب Actions در گیت‌هاب

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor script
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python monitor.py
