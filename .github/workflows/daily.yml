name: Daily Iran Think-Tank Digest

on:
  schedule:
    # هر روز ساعت 06:00 UTC (حدود 09:30 به‌وقت ایران) اجرا می‌شود.
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # امکان اجرای دستی از تب Actions در گیت‌هاب

permissions:
  contents: write   # لازم است تا اسکریپت بتواند فایل seen_links.json را کامیت کند

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # سقف ۵ ساعته برای اجراهایی که مقالات زیادی دارند
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install wkhtmltopdf (برای تبدیل صفحه مقاله به PDF)
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor script
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python monitor.py

      - name: Commit updated seen-links state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_links.json
          if git diff --cached --quiet; then
            echo "تغییری در seen_links.json نبود."
          else
            git commit -m "Update seen links [skip ci]"
            # اگر بین شروع اجرا و الان، مخزن توسط چیز دیگری (مثلاً آپلود دستی) تغییر کرده باشد،
            # اول تغییرات remote را می‌گیریم تا push رد نشود.
            git pull --rebase origin main
            git push
          fi
